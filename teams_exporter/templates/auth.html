<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect to Teams</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="auth-card">
  <p class="eyebrow">Local Teams export</p>
  <h1>Checking Teams sign-in</h1>
  <div id="auth-loading" class="loading-state" role="status" aria-live="polite">
    <span class="spinner" aria-hidden="true"></span>
    <span id="auth-status">Confirming the saved Teams sign-in…</span>
  </div>
  <p id="auth-error" class="auth-error" role="alert" hidden></p>
  <div class="auth-actions">
    <button id="retry-auth" class="secondary" type="button" hidden>Check again</button>
  </div>
</main>
<script src="/static/auth.js" defer></script>
</body>
</html>
