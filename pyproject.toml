[project]
name = "teams-connector"
version = "0.1.0"
description = "Local Microsoft Teams connector: MCP server and local export UI over Teams services and Microsoft Graph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "msal>=1.31,<2",
    "msal-extensions[portalocker]>=1.3,<2",
    "mcp>=1.26,<2",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<1",
    "pydantic>=2.11,<3",
    "starlette>=0.48",
    "uvicorn>=0.31",
]

[project.scripts]
teams-connector = "teams_connector.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src"]
exclude = ["research"]
