<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="session-token" content="{{SESSION_TOKEN}}">
  <title>Teams connector</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main>
  <header class="page-header">
    <div>
      <p class="eyebrow">Teams connector</p>
      <h1>Download conversations</h1>
      <p id="auth-help" class="auth-help" hidden></p>
    </div>
    <div id="account-info" class="account-info" aria-label="Signed-in account" hidden>
      <span class="account-avatar-wrap">
        <span id="account-avatar" class="avatar account-avatar" aria-hidden="true"></span>
        <span id="account-presence" class="presence-dot presence-unknown" role="img" aria-label="Presence unavailable" title="Presence unavailable"></span>
      </span>
      <span class="account-copy">
        <strong id="account-name"></strong>
        <span id="account-email" class="account-email"></span>
      </span>
    </div>
  </header>
  <section class="control-row" aria-label="Conversation and export controls">
    <div class="conversation-controls">
      <label for="chat-search">Find a conversation
        <input id="chat-search" type="search" placeholder="Chat or channel name">
      </label>
      <button id="refresh" class="secondary" type="button">Refresh chats</button>
    </div>
    <div class="export-controls">
      <div class="filter-field range-picker" id="range-picker">
        <span class="field-label">Message date range</span>
        <div class="range-control">
          <button id="range-toggle" class="range-toggle" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="calendar">
            <span id="range-label">Any date</span><svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
          </button>
          <button id="date-filter-clear" class="date-range-clear" type="button" aria-label="Clear date range" title="Clear date range" hidden>×</button>
        </div>
        <div id="calendar" class="calendar" role="dialog" aria-label="Choose an inclusive message date range" hidden>
          <div class="calendar-header">
            <button id="previous-month" class="calendar-nav" type="button" aria-label="Previous month">‹</button>
            <strong id="calendar-month"></strong>
            <button id="next-month" class="calendar-nav" type="button" aria-label="Next month">›</button>
          </div>
          <div class="weekdays" aria-hidden="true"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
          <div id="calendar-days" class="calendar-days"></div>
          <div class="calendar-footer">
            <button id="clear-dates" class="secondary" type="button" aria-label="Clear date range (any date)">Clear</button>
            <button id="today-date" class="secondary" type="button">Today</button>
            <button id="calendar-done" class="secondary" type="button">Done</button>
          </div>
        </div>
        <input id="from-date" type="hidden">
        <input id="to-date" type="hidden">
      </div>
      <label for="message-limit">Maximum messages per chat
        <input id="message-limit" type="number" min="1" max="1000000" step="1" placeholder="Unlimited">
      </label>
      <div id="settings-wrap" class="settings-wrap">
        <button id="settings-toggle" class="icon-button" type="button" aria-label="Export settings" title="Export settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8 4.8v-2.6l-2-.5a6.4 6.4 0 0 0-.6-1.5l1.1-1.8-1.8-1.8-1.8 1.1a6.4 6.4 0 0 0-1.5-.6l-.5-2h-2.6l-.5 2a6.4 6.4 0 0 0-1.5.6L6.5 5.1 4.7 6.9l1.1 1.8a6.4 6.4 0 0 0-.6 1.5l-2 .5v2.6l2 .5a6.4 6.4 0 0 0 .6 1.5l-1.1 1.8 1.8 1.8 1.8-1.1a6.4 6.4 0 0 0 1.5.6l.5 2h2.6l.5-2a6.4 6.4 0 0 0 1.5-.6l1.8 1.1 1.8-1.8-1.1-1.8a6.4 6.4 0 0 0 .6-1.5l2-.5Z"/></svg>
        </button>
        <div id="settings-menu" class="settings-menu" role="dialog" aria-label="Export settings" hidden>
          <label class="switch"><input id="include-summaries" type="checkbox" role="switch" checked><span>Include AI summaries of meetings</span></label>
          <label class="switch"><input id="include-transcripts" type="checkbox" role="switch" checked><span>Include meeting transcripts</span></label>
          <label class="switch"><input id="include-attachments" type="checkbox" role="switch" checked><span>Include message attachments</span></label>
        </div>
      </div>
    </div>
  </section>
  <section class="content-row" aria-label="Conversations and preview">
    <div class="conversation-pane">
      <div class="list-heading"><span id="selection-count" class="count">0 selected</span></div>
      <div id="chat-list" class="chat-list" aria-live="polite"><div class="loading-state" role="status"><span class="spinner" aria-hidden="true"></span><span>Loading conversations…</span></div></div>
    </div>
    <section class="preview-pane" aria-label="Conversation preview">
      <div id="preview-toolbar" class="preview-toolbar" hidden>
        <button id="view-entire-range" class="preview-link" type="button" hidden>View entire range</button>
        <div id="preview-status" class="preview-status" role="status" aria-live="polite"></div>
        <button id="retry-preview" class="secondary" type="button" hidden>Retry</button>
        <button id="cancel-preview" class="secondary" type="button" hidden>Cancel</button>
      </div>
      <div id="preview-content" class="preview-content" aria-label="Export text preview">
        <div class="preview-empty">Select a conversation to preview its export text.</div>
      </div>
    </section>
  </section>
  <footer class="footer-row">
    <div id="selected-chats" class="selected-chats" aria-label="Conversations selected for download"></div>
    <div class="footer-actions">
      <p id="status" role="status" aria-live="polite"></p>
      <div class="action-buttons">
        <button id="cancel-export" class="secondary" type="button" hidden>Cancel export</button>
        <button id="download" class="primary" type="button" disabled>Download</button>
      </div>
    </div>
  </footer>
</main>
<script src="/static/app.js" type="module"></script>
</body>
</html>
